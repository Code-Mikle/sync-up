# 公共配置文件
spring:
  profiles:
    active: dev # 本地开发默认激活 dev
  application:
    name: sync-up
  # DataSource Config
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${LOCAL_MYSQL_HOST:localhost}:${LOCAL_MYSQL_PORT:3306}/sync_up_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${LOCAL_MYSQL_USERNAME:root}
    password: ${LOCAL_MYSQL_PASSWORD:}
  # redis 配置
  data:
    redis:
      port: ${LOCAL_REDIS_PORT:6379}
      host: ${LOCAL_REDIS_HOST:localhost}
      database: 1
      password: ${LOCAL_REDIS_PASSWORD:}
  config:
    import: optional:file:.env[.properties]  # optional: 表示文件不存在时不报错

server:
  port: ${LOCAL_SERVER_PORT:8080}
  servlet:
    context-path: /api  # 会给所有接口统一加前缀

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-read-header: true
  is-read-body: false
  is-read-cookie: true
  cookie-auto-fill-prefix: true
  is-log: false

knife4j:
  enable: false
  setting:
    language: zh_cn

sync-up:
  ai:
    memory:
      chat-history-retention-days: ${SYNC_UP_AI_MEMORY_CHAT_HISTORY_RETENTION_DAYS:365}
      working-memory:
        recent-message-count: ${SYNC_UP_AI_MEMORY_RECENT_MESSAGE_COUNT:20}
        summary-batch-size: ${SYNC_UP_AI_MEMORY_SUMMARY_BATCH_SIZE:10}
        summary-input-max-tokens: ${SYNC_UP_AI_MEMORY_SUMMARY_INPUT_MAX_TOKENS:4000}
        max-context-tokens: ${SYNC_UP_AI_MEMORY_MAX_CONTEXT_TOKENS:6000}
        summary-max-chars: ${SYNC_UP_AI_MEMORY_SUMMARY_MAX_CHARS:1500}
      summary-scan-fixed-delay-ms: ${SYNC_UP_AI_MEMORY_SUMMARY_SCAN_FIXED_DELAY_MS:60000}
      task-scan-fixed-delay-ms: ${SYNC_UP_AI_MEMORY_TASK_SCAN_FIXED_DELAY_MS:30000}
      episode:
        extraction-enabled: ${SYNC_UP_AI_MEMORY_EPISODE_EXTRACTION_ENABLED:true}
        max-retries: ${SYNC_UP_AI_MEMORY_EPISODE_MAX_RETRIES:3}
        processing-timeout-minutes: ${SYNC_UP_AI_MEMORY_EPISODE_TIMEOUT_MINUTES:10}
        batch-size: ${SYNC_UP_AI_MEMORY_EPISODE_TASK_BATCH_SIZE:20}
        message-batch-size: ${SYNC_UP_AI_MEMORY_EPISODE_MESSAGE_BATCH_SIZE:100}
        message-batch-max-tokens: ${SYNC_UP_AI_MEMORY_EPISODE_MESSAGE_BATCH_MAX_TOKENS:6000}
      profile-update:
        default-evidence-threshold: ${SYNC_UP_AI_MEMORY_PROFILE_THRESHOLD:5}
        max-wait-days: ${SYNC_UP_AI_MEMORY_PROFILE_MAX_WAIT_DAYS:7}
        max-retries: ${SYNC_UP_AI_MEMORY_PROFILE_MAX_RETRIES:3}
        processing-timeout-minutes: ${SYNC_UP_AI_MEMORY_PROFILE_TIMEOUT_MINUTES:10}
        batch-size: ${SYNC_UP_AI_MEMORY_PROFILE_TASK_BATCH_SIZE:20}
    embedding:
      enabled: ${SYNC_UP_AI_EMBEDDING_ENABLED:${SYNC_UP_AI_AGENT_ENABLED:false}}
      base-url: ${SYNC_UP_AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${SYNC_UP_AI_EMBEDDING_MODEL:text-embedding-v4}
      api-key: ${DASHSCOPE_API_KEY:}
      dimensions: ${SYNC_UP_AI_EMBEDDING_DIMENSIONS:1024}
      timeout-ms: ${SYNC_UP_AI_EMBEDDING_TIMEOUT_MS:10000}
      max-retries: ${SYNC_UP_AI_EMBEDDING_MAX_RETRIES:1}
      log-requests: ${SYNC_UP_AI_EMBEDDING_LOG_REQUESTS:false}
      log-responses: ${SYNC_UP_AI_EMBEDDING_LOG_RESPONSES:false}
    team-embedding:
      initial-delay-ms: ${SYNC_UP_AI_TEAM_EMBEDDING_INITIAL_DELAY_MS:15000}
      fixed-delay-ms: ${SYNC_UP_AI_TEAM_EMBEDDING_FIXED_DELAY_MS:60000}
    tag-embedding:
      initial-delay-ms: ${SYNC_UP_AI_TAG_EMBEDDING_INITIAL_DELAY_MS:20000}
      fixed-delay-ms: ${SYNC_UP_AI_TAG_EMBEDDING_FIXED_DELAY_MS:60000}
    tag-resolution:
      high-confidence-score: ${SYNC_UP_AI_TAG_RESOLUTION_HIGH_CONFIDENCE_SCORE:0.72}
      min-candidate-score: ${SYNC_UP_AI_TAG_RESOLUTION_MIN_CANDIDATE_SCORE:0.60}
      min-top-score-margin: ${SYNC_UP_AI_TAG_RESOLUTION_MIN_TOP_SCORE_MARGIN:0.05}
    user-search:
      min-semantic-score: ${SYNC_UP_AI_USER_SEARCH_MIN_SEMANTIC_SCORE:0.62}
    agent:
      enabled: ${SYNC_UP_AI_AGENT_ENABLED:false}
      provider: ${SYNC_UP_AI_AGENT_PROVIDER:dashscope}
      base-url: ${SYNC_UP_AI_AGENT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${SYNC_UP_AI_AGENT_MODEL:qwen3.7-max-2026-05-20}
      api-key: ${DASHSCOPE_API_KEY:}
      temperature: ${SYNC_UP_AI_AGENT_TEMPERATURE:0.1}
      timeout-ms: ${SYNC_UP_AI_AGENT_TIMEOUT_MS:60000}
      max-tool-calls: ${SYNC_UP_AI_AGENT_MAX_TOOL_CALLS:7}
      max-input-length: ${SYNC_UP_AI_AGENT_MAX_INPUT_LENGTH:1000}
      log-requests: ${SYNC_UP_AI_AGENT_LOG_REQUESTS:false}
      log-responses: ${SYNC_UP_AI_AGENT_LOG_RESPONSES:false}


springdoc:
  api-docs:
    version: OPENAPI_3_0
  group-configs:
    - group: "default"
      paths-to-match: "/**"
      packages-to-scan: com.mikle.syncup.controller


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
